services:
  mysql:
    image: mysql:8.3
    container_name: cyberwise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # root only from inside the container — VM2 connects as MYSQL_USER.
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Bound to VM1's private IP only (exported by deploy.sh; loopback if run
    # without it, so a bare `docker compose up` never exposes it) — firewall it to VM2's IP.
    ports:
      - "${VM1_PRIVATE_IP:-127.0.0.1}:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      # TCP (127.0.0.1), not the socket: the image's temporary init server
      # runs with --skip-networking, so this only passes once init-db/ has
      # finished and the real server is listening.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Official minio/minio images are no longer publicly pullable (401 on quay.io
    # and Docker Hub); pgsty/minio is a community build of the same server.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: cyberwise-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${VM1_PRIVATE_IP:-127.0.0.1}:9000:9000"
      # Console on loopback only — SSH-tunnel in if needed.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  minio-data:

networks:
  default:
    driver: bridge
