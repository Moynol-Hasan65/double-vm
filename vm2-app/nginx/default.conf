resolver 127.0.0.11 valid=10s ipv6=off;

# Host is forwarded as $http_host (not $host) everywhere below: $host strips
# the :3000 port, so Next.js's derived x-forwarded-host wouldn't match the
# browser's Origin header (which has the port) and every Server Action gets
# rejected as a forged cross-origin request.

# Single entry point on port 3000, plain HTTP — no TLS for this POC.
# web, phish (landing page), user and lms all get published to the host
# only through here.

server {
    listen 3000 default_server;
    server_name _;

    # Gophish landing page, served under a path prefix so it shares this
    # port with the web app when only a raw IP (no DNS) is available.
    # Gophish's own router registers path-prefixed track/report routes
    # (see gophish/controllers/phish.go) specifically to support this —
    # proxy the path through unchanged, no rewrite/strip needed.
    location /landing/ {
        set $upstream http://cyberwise-phish:8080;
        proxy_pass         $upstream;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Gophish credential-capture endpoint script — only registered at
    # root by gophish (no path-prefixed variant), so it needs its own
    # passthrough alongside /landing/.
    location /static/ {
        set $upstream http://cyberwise-phish:8080;
        proxy_pass         $upstream;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        set $upstream http://cyberwise-web:3000;
        proxy_pass         $upstream;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Production/DNS scenario: once the client hands over a real domain, point
# a subdomain (e.g. landing.<client-domain>) at this same IP and swap
# server_name below — the landing page then gets the whole host, no path
# prefix needed, and NEXT_PUBLIC_LANDING_PAGE_URL becomes
# http://landing.<client-domain>:3000 (or add TLS back for production —
# this file has none for the POC). Still the same port, no new firewall
# request.
server {
    listen 3000;
    server_name landing.CHANGE_ME;

    location / {
        set $upstream http://cyberwise-phish:8080;
        proxy_pass         $upstream;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 3000;
    server_name api.user.local;

    location / {
        set $upstream http://cyberwise-user:8080;
        proxy_pass         $upstream;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# LMS is gRPC — published directly on 10082 (see docker-compose.yml), not
# proxied here: a plain proxy_pass can't carry gRPC.
